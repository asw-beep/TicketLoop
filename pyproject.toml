[project]
name = "ticketloop"
version = "0.1.0"
description = "Fixed-price ticket resale backend built to stay correct under concurrency and partial failure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.9",
    "celery==5.7.0",
    "email-validator>=2.4.0",
    "fastapi>=0.163.1",
    "httpx2>=2.16.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "faker>=40.63.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names, undefined names), I: import order,
# B: likely bugs, UP: modern Python syntax, SIM: simpler equivalents.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (start it with `docker compose up -d db`)",
]
