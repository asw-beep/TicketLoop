# Runs on every push and pull request, five jobs side by side:
#   test       the backend: lint, migrations, every test against Postgres 17, MinIO, RabbitMQ
#              and Redis
#   frontend   the React app: format, lint, types, unit tests, build, and API types in sync
#   e2e        the browser tests: Chrome clicking through Vite, the API, its worker and relay
#   image      the Docker image built, migrated and started with production settings
#   security   Bandit, pip-audit and npm audit: known vulnerabilities fail the build
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A service container: GitHub starts Postgres next to the job and waits for its
    # healthcheck before running any step. The same image as docker-compose.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ticketloop
          POSTGRES_PASSWORD: ticketloop
          POSTGRES_DB: ticketloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketloop -d ticketloop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The message broker (M9): the outbox relay publishes here and the workers consume.
      rabbitmq:
        image: rabbitmq:4.2.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ticketloop
          RABBITMQ_DEFAULT_PASS: ticketloop
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The cache and the rate limiter (M10).
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The job runs on the runner itself, so Postgres is at localhost, as on a laptop.
      DATABASE_URL: postgresql+psycopg://ticketloop:ticketloop@localhost:5432/ticketloop
      ENVIRONMENT: test
      # Fail, don't skip, if the integration tests cannot reach Postgres.
      REQUIRE_POSTGRES: "1"
      # And fail, don't skip, if the storage tests cannot reach MinIO.
      REQUIRE_STORAGE: "1"
      # And fail, don't skip, if the messaging drills cannot reach RabbitMQ.
      REQUIRE_BROKER: "1"
      # And fail, don't skip, if the cache and rate-limit tests cannot reach Redis.
      REQUIRE_REDIS: "1"

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact tags only (no floating v10), so pin a release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2" # the same uv as the Dockerfile
          enable-cache: true # keyed on uv.lock, so dependencies download once

      - name: Install dependencies
        run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Start MinIO
        # Not a service container: the image has no default command (its entrypoint is a bare
        # `minio`), and service containers cannot pass one. Same pinned build as compose.
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=ticketloop -e MINIO_ROOT_PASSWORD=ticketloop-local-secret             cgr.dev/chainguard/minio@sha256:548147b5fc95a67e3e45285dff7e0e50326c3eb1977c6218039461771156c5e7             server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio
          exit 1

      - name: Migrate and check the models match the migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the LTS line; package.json asks for >=24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # For the API-types check below, which exports the OpenAPI description with Python.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install dependencies
        run: npm ci # exactly package-lock.json, and fails if it disagrees with package.json

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Regenerate openapi.json and schema.d.ts from the backend. A difference means someone
      # changed the API without regenerating, and the frontend's types would be lying.
      - name: API types match the backend
        run: |
          npm run api:types
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ticketloop
          POSTGRES_PASSWORD: ticketloop
          POSTGRES_DB: ticketloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketloop -d ticketloop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches the reset emails; the tests read them through its API.
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
      # The message broker (M9): the outbox relay publishes here and the workers consume.
      rabbitmq:
        image: rabbitmq:4.2.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ticketloop
          RABBITMQ_DEFAULT_PASS: ticketloop
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The cache and the rate limiter (M10).
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ticketloop:ticketloop@localhost:5432/ticketloop
      ENVIRONMENT: local # as on a laptop: email goes to Mailpit on localhost:1025
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci --prefix frontend

      - name: Start MinIO
        # Not a service container: the image has no default command (its entrypoint is a bare
        # `minio`), and service containers cannot pass one. Same pinned build as compose.
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=ticketloop -e MINIO_ROOT_PASSWORD=ticketloop-local-secret             cgr.dev/chainguard/minio@sha256:548147b5fc95a67e3e45285dff7e0e50326c3eb1977c6218039461771156c5e7             server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio
          exit 1

      # Playwright starts the API and the dev server itself (playwright.config.ts); the API
      # creates and migrates its own database first, then starts a worker and the relay.
      - name: Browser tests
        working-directory: frontend
        run: npx playwright test

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # The image docker compose runs, started the way a deployment would start it: production
  # settings (the built-in development secrets are refused there), its own migration, and its
  # own user, never root.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ticketloop
          POSTGRES_PASSWORD: ticketloop
          POSTGRES_DB: ticketloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketloop -d ticketloop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ticketloop:ticketloop@localhost:5432/ticketloop

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t ticketloop:ci .

      # --network host: the container reaches the Postgres service on localhost, as the job does.
      - name: Migrate with the image
        run: docker run --rm --network host -e DATABASE_URL ticketloop:ci alembic upgrade head

      - name: Start the API with production settings
        run: |
          docker run -d --name api --network host -e DATABASE_URL             -e ENVIRONMENT=production             -e JWT_SECRET_KEY="$(openssl rand -hex 32)"             -e STORAGE_SECRET_KEY="$(openssl rand -hex 32)"             -e FAKEPAY_WEBHOOK_SECRET="$(openssl rand -hex 32)"             ticketloop:ci

      - name: Wait for its health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

      - name: It runs as uid 10001, not root
        run: test "$(docker exec api id -u)" = "10001"

      - name: Its logs, when something above failed
        if: failure()
        run: docker logs api

  # Known vulnerabilities and risky code fail the build.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.2"
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The app and fakepay; tests and scripts never ship. A high-severity finding fails.
      - name: Bandit
        run: uvx bandit==1.9.4 -r app fakepay --severity-level high

      # Exactly the packages the image installs, pinned and hashed by uv.lock. pip-audit gives
      # no severities, so any known vulnerability fails.
      - name: pip-audit
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt             -o requirements-runtime.txt
          uvx pip-audit==2.10.1 -r requirements-runtime.txt --require-hashes --disable-pip             --progress-spinner off

      # Every package in package-lock.json, the build tools included. A high or critical
      # advisory fails; a moderate one is left for `npm audit fix` in its own time.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
