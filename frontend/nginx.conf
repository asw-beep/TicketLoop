# The browser app on :80 (5173 on the host), and /api forwarded to the API.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, asked per request because proxy_pass takes a variable: nginx starts
    # whether or not the API is up yet, and finds it again when it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        # A variable with no path after the host: the request's own path and query go as sent.
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API limits by the socket's address, never these headers, so behind this proxy
        # every browser shares nginx's address: fine for one person on localhost, as with
        # Vite's proxy. A deployment would let uvicorn trust them from this proxy alone.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Above the API's own 6 MiB, so an upload too big gets the API's problem+json 413.
        client_max_body_size 8m;
    }

    location / {
        # /orders/123 is a page of the app, not a file: the app's router draws it.
        try_files $uri /index.html;
        add_header Cache-Control "no-cache"; # asked again each time, so a new build shows up
    }

    # Bundles are named by their content, so they can be kept for good; index.html never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
