# Alembic: database migrations. Common commands, from the repo root:
#   uv run alembic upgrade head              apply every migration
#   uv run alembic upgrade head --sql        print the SQL instead of running it (read it first)
#   uv run alembic downgrade base            undo every migration
#   uv run alembic revision --autogenerate -m "add orders"   draft a migration from the models
#   uv run alembic check                     fail if the models and the migrations disagree
#
# The database URL is not set here: migrations/env.py reads it from app.core.config.Settings,
# so the app and its migrations always point at the same database.

[alembic]
script_location = %(here)s/migrations

# Date first, so `ls migrations/versions` lists migrations in the order they were written.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os


[post_write_hooks]
# Lint and format every newly generated migration so it passes `ruff check` unchanged.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# Logging for the alembic command line. env.py skips this when tests run migrations, so it
# never replaces the app's or pytest's logging setup.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
