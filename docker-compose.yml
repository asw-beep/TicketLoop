# Local stack. Two ways to use it:
#   docker compose up --build          everything: Postgres, Mailpit, MinIO, fakepay, RabbitMQ,
#                                      Redis, migrations, the API (localhost:8000), and the
#                                      worker, beat and relay that move events and tickets
#   docker compose up -d db mailpit minio fakepay rabbitmq redis worker beat relay
#                                      everything but the API; run that on Windows with
#                                      uvicorn --reload, and the frontend with npm run dev
# Values like ${POSTGRES_USER:-ticketloop} come from .env if it exists, else the default.

name: ticketloop

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketloop}
      POSTGRES_DB: ${POSTGRES_DB:-ticketloop}
    ports:
      - "5432:5432" # host:container, so tools on Windows reach it at localhost:5432
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume: data survives `docker compose down`
    healthcheck:
      # $$ stops compose from substituting; the container's shell expands the variable.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # A fake mail server: catches every email the app sends and shows it in a web inbox at
  # http://localhost:8025. Nothing is delivered to a real address.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025" # the web inbox
      - "1025:1025" # SMTP, where the API sends

  # S3-compatible object storage for ticket evidence (M4). MinIO stopped publishing its free
  # image in Oct 2025; this is Chainguard's free rebuild. Chainguard publishes only `latest`,
  # so the image is pinned to an exact build by digest. The app talks to it only through the
  # S3 API (boto3), so any S3-compatible server can replace it by changing settings.
  # Web console: http://localhost:9001 (log in with the root user and password below).
  minio:
    image: cgr.dev/chainguard/minio@sha256:548147b5fc95a67e3e45285dff7e0e50326c3eb1977c6218039461771156c5e7
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-ticketloop}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-ticketloop-local-secret}
    ports:
      - "9000:9000" # the S3 API, and where presigned download links point
      - "9001:9001" # the web console
    volumes:
      - miniodata:/data

  # The pretend payment gateway (M8): its own app, its own database (an SQLite file), and
  # nothing in common with the API but the webhook secret. Buyers pay at http://localhost:8090.
  fakepay:
    build: .
    command: ["uvicorn", "fakepay.main:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      FAKEPAY_DB: /data/fakepay.db
      FAKEPAY_PUBLIC_URL: http://localhost:8090
      # The API on the host's port 8000, whether it runs in Docker or on Windows.
      FAKEPAY_WEBHOOK_URL: http://host.docker.internal:8000/api/v1/payments/webhooks/fakepay
      FAKEPAY_WEBHOOK_SECRET: &fakepay_secret ${FAKEPAY_WEBHOOK_SECRET:-local-development-only-fakepay-secret-do-not-deploy}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Desktop has it; Linux needs it spelled out
    ports:
      - "8090:8090"
    volumes:
      - fakepaydata:/data

  # The message broker (M9). Management UI at http://localhost:15672 (ticketloop / ticketloop).
  rabbitmq:
    image: rabbitmq:4.2.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketloop
      RABBITMQ_DEFAULT_PASS: ticketloop
    ports:
      - "5672:5672" # AMQP, where the relay publishes and the worker consumes
      - "15672:15672" # the management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # The cache and the rate limiter (M10). Nothing in it has to survive a restart: an empty
  # cache refills from Postgres, and empty buckets are full ones.
  redis:
    image: redis:8.4.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Celery: the consumers (transfers, notifications) and the scheduled jobs beat sends it.
  # Celery does not support Windows, so on a laptop this runs here even when the API does not.
  worker:
    build: .
    # A worker exits once it has given up reaching the broker; this brings it back.
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker",
              "-Q", "transfers,notifications,maintenance", "--concurrency", "2", "--loglevel", "INFO"]
    environment: &worker_env
      DATABASE_URL: &database_url postgresql+psycopg://${POSTGRES_USER:-ticketloop}:${POSTGRES_PASSWORD:-ticketloop}@db:5432/${POSTGRES_DB:-ticketloop}
      BROKER_URL: amqp://ticketloop:ticketloop@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      FAKEPAY_URL: http://fakepay:8090
      FAKEPAY_WEBHOOK_SECRET: *fakepay_secret
      LOG_JSON: "true"
    depends_on: &after_migrations
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Sends the scheduled jobs: hold expiry every 30 s, listing expiry every 5 min,
  # reconciliation and stalled transfers every 2 min. Exactly one beat may run, or every job
  # runs twice as often.
  beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    environment: *worker_env
    depends_on: *after_migrations

  # The outbox relay: publishes committed events to RabbitMQ. Any number may run.
  relay:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.relay"]
    environment: *worker_env
    depends_on: *after_migrations

  # A one-off job: bring the schema up to date, then exit. Kept out of the API's own startup
  # so several API containers (load tests) never race to migrate at once.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database_url
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      # Inside the compose network the database's hostname is its service name, `db`.
      DATABASE_URL: *database_url
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      SMTP_HOST: mailpit
      # The API reaches MinIO by its service name; the browser reaches it on localhost,
      # so download links are signed for localhost.
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ticketloop}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-ticketloop-local-secret}
      FAKEPAY_URL: http://fakepay:8090
      FAKEPAY_WEBHOOK_SECRET: *fakepay_secret
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # wait for pg_isready, not just for the container to start
      migrate:
        condition: service_completed_successfully # start only once the schema is current
      minio:
        condition: service_started # the image has no shell or curl for a healthcheck
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  fakepaydata:
  rabbitmqdata:
